[package]
name = "anvyx"
description.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
anvyx-lang = { path = "../lang" }
anvyx-lang2 = { path = "../lang2" }
anvyx-externs = { path = "../externs" }
anvyx-fmt = { path = "../fmt" }
anvyx-std = { path = "../std" }
anvyx-core = { path = "../core" }
anvyx-stdlib2 = { path = "../stdlib2" }
anvyx-core2 = { path = "../core2" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
console = "0.15"
walkdir = "2.5.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
